<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceren'e Özel 💖</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffe6eb;
            background-image: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .gif-container {
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        h1 {
            color: #d63384;
            font-size: 1.5rem;
            margin-bottom: 30px;
            font-weight: 700;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 60px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 10;
        }

        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: absolute;
            transition: 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <div class="gif-container">
            <img id="gifImg" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2bzN5d2VvOWV5MTg5MGVjaWZ2bm1sM3QwbHZqaWh2am5jZmZudyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKSjRrfIPjeiVyM/giphy.gif" alt="Sevimli GIF">
        </div>
        <h1 id="questionText">Benimle flörte çıkar mısın Ceren? 💖</h1>
        <div class="buttons" id="buttonArea">
            <button class="btn" id="yesBtn" onclick="sayYes()">Evet 🥰</button>
            <button class="btn" id="noBtn" onclick="moveNo()" onmouseover="moveNo()">Hayır 😢</button>
        </div>
    </div>

    <script>
        const steps = [
            {
                text: "Benimle flörte çıkar mısın Ceren? 💖",
                gif: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2bzN5d2VvOWV5MTg5MGVjaWZ2bm1sM3QwbHZqaWh2am5jZmZudyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKSjRrfIPjeiVyM/giphy.gif"
            },
            {
                text: "Emin misin? Bak üzülürüm ama... 🥺",
                gif: "https://media.giphy.com/media/3ov9jLsBqPh6rjuHuM/giphy.gif"
            },
            {
                text: "Bence tekrar düşünmelisin! 🧐",
                gif: "https://media.giphy.com/media/26ufcVAp3AiJJsrIs/giphy.gif"
            },
            {
                text: "Hayır seçeneği aslında çalışmıyor ki :) 💕",
                gif: "https://media.giphy.com/media/14uQ3cOFteDaU/giphy.gif"
            },
            {
                text: "Hala inat ediyorsun ama yaa! 😭",
                gif: "https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif"
            },
            {
                text: "Peki, 'Evet' butonuna basmak için son şans! 🥰",
                gif: "https://media.giphy.com/media/l0HlBO7EyXzSZkJri/giphy.gif"
            }
        ];

        let currentStep = 0;

        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionText = document.getElementById('questionText');
        const gifImg = document.getElementById('gifImg');

        function moveNo() {
            currentStep++;
            
            if (currentStep < steps.length) {
                questionText.innerText = steps[currentStep].text;
                gifImg.src = steps[currentStep].gif;
            }

            let currentSize = window.getComputedStyle(yesBtn).fontSize;
            let newSize = parseFloat(currentSize) * 1.1;
            yesBtn.style.fontSize = newSize + 'px';

            const maxX = 120;
            const maxY = 80;
            const randomX = (Math.random() - 0.5) * maxX * 2;
            const randomY = (Math.random() - 0.5) * maxY * 2;

            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function sayYes() {
            questionText.innerText = "Yeeeey! Biliyordum zaten, seni çok seviyorum Ceren'im! 🎉💖";
            gifImg.src = "https://media.giphy.com/media/5bdhq6YF0szPaCEk9Y/giphy.gif";
            
            document.getElementById('buttonArea').style.display = 'none';

            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
